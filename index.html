<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>
    <script defer src="main.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;600;700&display=swap');

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Lato', sans-serif;
        background-color: #e8dae1;
        color: #2c2c2c;
        min-height: 100vh;
      }

      header {
        background-color: #adc4d4;
        padding: 20px 40px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }

      header h1 {
        font-family: 'Merriweather', serif;
        color: #d63384;
        font-size: 1.8rem;
        letter-spacing: 1px;
        text-align: center;
      }

      main {
        max-width: 860px;
        margin: 36px auto;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      section {
        background: #fff;
        border-radius: 10px;
        padding: 28px 32px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        border: 1px solid #e0dbd0;
      }

      section h2 {
        font-family: 'Merriweather', serif;
        font-size: 1.15rem;
        color: #d63384;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0c0d8;
      }

      /* Form styles */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="text"],
      input[type="number"] {
        padding: 10px 14px;
        border: 1.5px solid #d4cfc6;
        border-radius: 6px;
        font-family: 'Lato', sans-serif;
        font-size: 0.95rem;
        background: #faf9f6;
        color: #2c2c2c;
        transition: border-color 0.2s;
        outline: none;
      }

      input[type="text"]:focus,
      input[type="number"]:focus {
        border-color: #361123;
        background: #fff;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .checkbox-group input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: #d63384;
        cursor: pointer;
      }

      .checkbox-group label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #444;
        text-transform: none;
        letter-spacing: 0;
        cursor: pointer;
      }

      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #d63384;
        color: #fff;
        border: none;
        border-radius: 7px;
        font-family: 'Lato', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
      }

      button[type="submit"]:hover {
        background-color: #b02070;
      }

      button[type="submit"]:active {
        transform: scale(0.98);
      }

      /* Search form */
      #searchBook {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      #searchBook label {
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      #searchBook input {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #d4cfc6;
        border-radius: 6px;
        font-family: 'Lato', sans-serif;
        font-size: 0.95rem;
        background: #faf9f6;
        outline: none;
        transition: border-color 0.2s;
      }

      #searchBook input:focus {
        border-color: #d63384;
        background: #fff;
      }

      #searchBook button[type="submit"] {
        width: auto;
        padding: 10px 22px;
        font-size: 0.9rem;
      }

      /* Book list sections */
      #incompleteBookList,
      #completeBookList {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 40px;
      }

      .empty-state {
        color: #aaa;
        font-size: 0.9rem;
        font-style: italic;
        text-align: center;
        padding: 18px 0 6px;
      }

      /* Book item */
      [data-testid="bookItem"] {
        background: #faf9f6;
        border: 1px solid #e5e0d6;
        border-radius: 8px;
        padding: 16px 18px;
        transition: box-shadow 0.2s;
      }

      [data-testid="bookItem"]:hover {
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      }

      [data-testid="bookItemTitle"] {
        font-family: 'Merriweather', serif;
        font-size: 1rem;
        color: #2c2c2c;
        margin-bottom: 4px;
      }

      [data-testid="bookItemAuthor"],
      [data-testid="bookItemYear"] {
        font-size: 0.85rem;
        color: #777;
        margin-bottom: 2px;
      }

      .book-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      .book-actions button {
        padding: 7px 14px;
        border: none;
        border-radius: 5px;
        font-family: 'Lato', sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }

      .book-actions button:hover {
        opacity: 0.85;
      }

      .book-actions button:active {
        transform: scale(0.97);
      }

      [data-testid="bookItemIsCompleteButton"] {
        background-color: #a8d5b5;
        color: #1a5c30;
      }

      [data-testid="bookItemDeleteButton"] {
        background-color: #f4a9a8;
        color: #7a1a19;
      }

      [data-testid="bookItemEditButton"] {
        background-color: #f9c9a0;
        color: #7a3e0a;
      }

      /* Edit modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-box {
        background: #fff;
        border-radius: 12px;
        padding: 32px 36px;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        position: relative;
      }

      .modal-box h2 {
        font-family: 'Merriweather', serif;
        color: #d63384;
        margin-bottom: 20px;
        font-size: 1.1rem;
        border-bottom: 2px solid #f0c0d8;
        padding-bottom: 10px;
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 18px;
        background: none;
        border: none;
        font-size: 1.4rem;
        cursor: pointer;
        color: #888;
        line-height: 1;
        padding: 4px;
      }

      .modal-close:hover {
        color: #333;
      }

      #editBookSubmit {
        width: 100%;
        padding: 12px;
        background-color: #d63384;
        color: #fff;
        border: none;
        border-radius: 7px;
        font-family: 'Lato', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 6px;
        transition: background-color 0.2s;
      }

      #editBookSubmit:hover {
        background-color: #b02070;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bookshelf App</h1>
    </header>

    <main>
      <!-- Form tambah buku -->
      <section>
        <h2>Tambah Buku Baru</h2>
        <form id="bookForm" data-testid="bookForm">
          <div class="form-group">
            <label for="bookFormTitle">Judul</label>
            <input id="bookFormTitle" type="text" required data-testid="bookFormTitleInput" placeholder="Masukkan judul buku..." />
          </div>
          <div class="form-group">
            <label for="bookFormAuthor">Penulis</label>
            <input id="bookFormAuthor" type="text" required data-testid="bookFormAuthorInput" placeholder="Nama penulis..." />
          </div>
          <div class="form-group">
            <label for="bookFormYear">Tahun</label>
            <input id="bookFormYear" type="number" required data-testid="bookFormYearInput" placeholder="Contoh: 2020" />
          </div>
          <div class="checkbox-group">
            <input id="bookFormIsComplete" type="checkbox" data-testid="bookFormIsCompleteCheckbox" />
            <label for="bookFormIsComplete">Selesai dibaca</label>
          </div>
          <button id="bookFormSubmit" type="submit" data-testid="bookFormSubmitButton">
            Masukkan Buku ke rak <span>Belum selesai dibaca</span>
          </button>
        </form>
      </section>

      <!-- Form cari buku -->
      <section>
        <h2>Cari Buku (Opsional)</h2>
        <form id="searchBook" data-testid="searchBookForm">
          <label for="searchBookTitle">Judul</label>
          <input id="searchBookTitle" type="text" data-testid="searchBookFormTitleInput" placeholder="Cari judul buku..." />
          <button id="searchSubmit" type="submit" data-testid="searchBookFormSubmitButton">Cari</button>
        </form>
      </section>

      <!-- Rak belum selesai -->
      <section>
        <h2>Belum selesai dibaca</h2>
        <div id="incompleteBookList" data-testid="incompleteBookList">
          <p class="empty-state">Belum ada buku di sini.</p>
        </div>
      </section>

      <!-- Rak selesai -->
      <section>
        <h2>Selesai dibaca</h2>
        <div id="completeBookList" data-testid="completeBookList">
          <p class="empty-state">Belum ada buku di sini.</p>
        </div>
      </section>
    </main>

    <!-- Modal Edit Buku -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-box">
        <button class="modal-close" id="closeEditModal">&times;</button>
        <h2>Edit Buku</h2>
        <div class="form-group">
          <label for="editTitle">Judul</label>
          <input id="editTitle" type="text" required placeholder="Judul buku..." />
        </div>
        <div class="form-group">
          <label for="editAuthor">Penulis</label>
          <input id="editAuthor" type="text" required placeholder="Nama penulis..." />
        </div>
        <div class="form-group">
          <label for="editYear">Tahun</label>
          <input id="editYear" type="number" required placeholder="Tahun terbit..." />
        </div>
        <div class="checkbox-group">
          <input id="editIsComplete" type="checkbox" />
          <label for="editIsComplete">Selesai dibaca</label>
        </div>
        <button id="editBookSubmit">Simpan Perubahan</button>
      </div>
    </div>
  </body>
</html>
